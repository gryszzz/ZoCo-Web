name: Validate technical SEO

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  seo-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify refreshed ZoCo site icons
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python scripts/build_brand_icons.py
      - name: Validate sitemap, metadata and structured data
        run: python3 scripts/check_seo.py
