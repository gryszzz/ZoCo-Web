name: Deploy ZoCo Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build search and app icons
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("zoco-logo-v2.webp").convert("RGBA")
          resample = Image.Resampling.LANCZOS
          src.resize((96, 96), resample).save("favicon.png", "PNG", optimize=True)
          src.resize((192, 192), resample).save("icon-192.png", "PNG", optimize=True)
          src.resize((512, 512), resample).save("icon-512.png", "PNG", optimize=True)
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
