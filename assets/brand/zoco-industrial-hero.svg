  <g fill="#52ceff" opacity=".8"><circle cx="1362" cy="627" r="11"/><circle cx="1709" cy="565" r="9"/><circle cx="1296" cy="757" r="7"/><circle cx="1658" cy="763" r="11"/><circle cx="1764" cy="658" r="7"/><circle cx="1235" cy="686" r="8"/></g>
