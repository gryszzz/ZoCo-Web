<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-label="Industrial drain pipes, subtle orange light and flowing blue water">
<defs>
  <linearGradient id="wall" x2="1" y2=".36"><stop stop-color="#1b2228"/><stop offset=".42" stop-color="#0a1017"/><stop offset=".8" stop-color="#111a20"/><stop offset="1" stop-color="#0d1118"/></linearGradient>
  <linearGradient id="steel" x2="1"><stop stop-color="#11171b"/><stop offset=".08" stop-color="#84959e"/><stop offset=".18" stop-color="#232c34"/><stop offset=".44" stop-color="#55636d"/><stop offset=".55" stop-color="#11191e"/><stop offset=".77" stop-color="#344049"/><stop offset=".97" stop-color="#88929a"/><stop offset="1" stop-color="#171c21"/></linearGradient>
  <linearGradient id="steelV" x2=".25" y2="1"><stop stop-color="#828b93"/><stop offset=".2" stop-color="#18222b"/><stop offset=".6" stop-color="#53636e"/><stop offset="1" stop-color="#070d11"/></linearGradient>
  <linearGradient id="flow" x2="1" y2="1"><stop stop-color="#b9f5ff"/><stop offset=".18" stop-color="#34c9ff"/><stop offset=".58" stop-color="#056bae"/><stop offset=".85" stop-color="#3bcbff"/><stop offset="1" stop-color="#9af1ff"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#202c31"/><stop offset="1" stop-color="#05080a"/></linearGradient>
  <radialGradient id="orange"><stop stop-color="#ff7325" stop-opacity=".5"/><stop offset=".43" stop-color="#dc4c13" stop-opacity=".13"/><stop offset="1" stop-color="#ff7721" stop-opacity="0"/></radialGradient>
  <radialGradient id="blue"><stop stop-color="#00b4ef" stop-opacity=".27"/><stop offset="1" stop-color="#008fcf" stop-opacity="0"/></radialGradient>
  <pattern id="grain" width="110" height="88" patternUnits="userSpaceOnUse"><path d="M0 88V0H110" fill="none" stroke="#b7cad7" stroke-opacity=".04" stroke-width="1"/><path d="M27 66h15m35-44h24" stroke="#fff" stroke-opacity=".04" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<path fill="url(#wall)" d="M0 0h1800v960H0z"/>
<path fill="url(#grain)" d="M0 0h1800v960H0z"/>
<path fill="url(#orange)" d="M-250-130h1180v1200H-250z"/>
